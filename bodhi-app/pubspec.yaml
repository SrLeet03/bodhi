name: bodhi_app
description: "Bodhi — Sarve Santu Niramaya. Senior citizen care platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  speech_to_text: ^6.6.2
  flutter_tts: ^4.0.2
  local_auth: ^2.2.0
  shared_preferences: ^2.3.2
  flutter_svg: ^2.0.10
  lottie: ^3.1.0
  intl: ^0.19.0
  cached_network_image: ^3.4.0
  url_launcher: ^6.3.0
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
